[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "rnacosctl"
version = "0.1.0"
description = "An agent-friendly CLI for the r-nacos administration console"
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
license-files = ["LICENSE"]
keywords = ["r-nacos", "nacos", "cli", "configuration", "agent"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Environment :: Console",
    "Programming Language :: Python :: 3",
    "Topic :: System :: Systems Administration",
]
dependencies = [
    "click>=8.1,<9",
    "cryptography>=42",
    "filelock>=3.16",
    "httpx>=0.27,<1",
    "platformdirs>=4",
    "truststore>=0.10,<1",
]

[project.urls]
Homepage = "https://github.com/xiaoland/rnacosctl"
Issues = "https://github.com/xiaoland/rnacosctl/issues"

[project.scripts]
rnacosctl = "rnacosctl.cli:main"

[dependency-groups]
dev = ["pytest>=8", "ruff>=0.12", "twine>=6"]

[tool.hatch.build.targets.sdist]
include = ["/src", "/LICENSE", "/README.md", "/pyproject.toml", "/tests"]

[tool.hatch.build.targets.wheel]
packages = ["src/rnacosctl"]

[tool.ruff]
target-version = "py310"
line-length = 100
